name: CI et déploiement

on:
  # Chaque PR vers main est vérifiée (tests + build) avant fusion.
  pull_request:
    branches: [main]
  # Seule la branche main est mise en production.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  # L'app est désormais hébergée par Cloudflare Pages (déploiement automatique depuis main, voir DEPLOIEMENT.md).
  # L'ancienne adresse GitHub Pages ne sert plus qu'une page de déménagement : redirection + transfert des données.
  deploy:
    name: Page de déménagement (GitHub Pages)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEW_APP_URL: ${{ vars.NEW_APP_URL || 'https://new-shape.pages.dev' }}
    steps:
      - uses: actions/checkout@v4
      - name: Adresse de la nouvelle app
        run: sed -i "s#__NEW_APP_URL__#${NEW_APP_URL}#" legacy/move.js && grep -q "${NEW_APP_URL}" legacy/move.js
      - name: Publier legacy/ sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./legacy
          force_orphan: true
