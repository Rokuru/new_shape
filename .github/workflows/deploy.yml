name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/muscu-tracker]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Variables du dépôt (Settings → Secrets and variables → Actions → Variables) ; facultatives.
          VITE_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          VITE_AUTH_PROXY_URL: ${{ vars.AUTH_PROXY_URL }}
      - name: Publier dist/ sur la branche gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
